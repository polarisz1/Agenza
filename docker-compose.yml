services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agenza
      POSTGRES_USER: agenza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - agenza-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenza -d agenza"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://agenza:${POSTGRES_PASSWORD}@db:5432/agenza
      DATA_DIR: /data
      RESOURCE_DIR: /app
      MOUNT_FRONTEND: "true"
      DEBUG: "false"
      LOG_LEVEL: INFO
      TENANCY_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      CORS_ORIGINS: "[]"
      ENGINE_MAX_CONCURRENCY: "4"
      DEFAULT_TIMEOUT: "120"
      RUN_RETENTION: "200"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - agenza-data:/data

volumes:
  agenza-pgdata:
  agenza-data:
