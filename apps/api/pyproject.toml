[project]
name = "agentflow-api"
version = "0.1.0"
description = "AgentFlow 后端 API - 单用户本地 AI 工作流编排平台"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13.3",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "loguru>=0.7.2",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "python-dotenv>=1.0.1",
    "apscheduler>=3.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.6.0",
    # 契约导出需要（packages/contracts/scripts/generate.mjs 用 PyYAML 转 YAML）
    "pyyaml>=6.0",
]

[project.scripts]
agentflow-api = "app.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/**", "*.lock"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
