[project]
name = "agentflow-api"
version = "0.1.0"
description = "AgentFlow 后端 API - 单用户本地 AI 工作流编排平台"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13.3",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "loguru>=0.7.2",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "python-dotenv>=1.0.1",
    "apscheduler>=3.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.6.0",
    # 契约导出需要（packages/contracts/scripts/generate.mjs 用 PyYAML 转 YAML）
    "pyyaml>=6.0",
]

[project.scripts]
agentflow-api = "app.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/**", "*.lock"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
# E501: 行宽由 formatter 保证
# B008: FastAPI 的 Depends()/Query() 默认值是官方写法
# RUF001/002/003: 本项目文案与注释为中文，全角标点是有意的（产品语言），不是笔误
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# main.py 在 app 实例创建后才注册路由，import 顺序是有意为之
"src/app/main.py" = ["E402"]
# __init__ 里的 re-export 属于公开接口
"src/app/**/__init__.py" = ["F401"]
# 引擎里 WHITE/GRAY/BLACK 这类常量沿用 DFS 惯例命名
"src/app/core/engine/validators.py" = ["N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
    "slow: 需要外部网络或长时间运行的用例",
]
