  /api/runs/{run_id}/events:
    get:
      tags:
      - runs
      summary: Run Events
      description: "SSE - 实时推送 run 事件。\n\n- 先回放内存事件历史（按 Last-Event-ID 补齐）；\n- 内存里完全没有这次运行的历史（如后端重启）时，用已落库的\
        \ node_run 兜底回放，\n  并给回放事件补上单调递增的 seq；\n- 之后持续订阅 EventBus 直到 run 结束。\n\n注意：这里**不**用\
        \ `Depends(get_session)`。请求级 Session 会一直被这条长连接占着，\n多个 SSE 客户端就能把连接池吃干。存在性检查用完即关。"
      operationId: run_events_api_runs__run_id__events_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: last_event_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Event Id
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Last-Event-Id
