openapi: 3.1.0
info:
  title: AgentFlow
  description: AgentFlow - Single-user local AI workflow orchestration
  version: 0.1.0
paths:
  /api/workflows:
    get:
      tags:
      - workflows
      summary: List Workflows
      operationId: list_workflows_api_workflows_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: updated_desc
          title: Sort
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_WorkflowListData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - workflows
      summary: Create Workflow
      operationId: create_workflow_api_workflows_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_WorkflowResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workflows/import:
    post:
      tags:
      - workflows
      summary: Import Workflows
      description: 导入工作流：confirm=false 预览（含重名副本命名），confirm=true 写入。
      operationId: import_workflows_api_workflows_import_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowImportRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_WorkflowImportResult_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workflows/validate:
    post:
      tags:
      - workflows
      summary: Validate Graph Body
      description: 校验任意（未保存）图结构。
      operationId: validate_graph_body_api_workflows_validate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphDef'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ValidateResult_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workflows/{wf_id}:
    get:
      tags:
      - workflows
      summary: Get Workflow
      operationId: get_workflow_api_workflows__wf_id__get
      parameters:
      - name: wf_id
        in: path
        required: true
        schema:
          type: string
          title: Wf Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_WorkflowResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - workflows
      summary: Update Workflow
      operationId: update_workflow_api_workflows__wf_id__put
      parameters:
      - name: wf_id
        in: path
        required: true
        schema:
          type: string
          title: Wf Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_WorkflowResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - workflows
      summary: Delete Workflow
      operationId: delete_workflow_api_workflows__wf_id__delete
      parameters:
      - name: wf_id
        in: path
        required: true
        schema:
          type: string
          title: Wf Id
      - name: confirm
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Confirm
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_DeleteResult_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workflows/{wf_id}/duplicate:
    post:
      tags:
      - workflows
      summary: Duplicate Workflow
      operationId: duplicate_workflow_api_workflows__wf_id__duplicate_post
      parameters:
      - name: wf_id
        in: path
        required: true
        schema:
          type: string
          title: Wf Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_DuplicateResult_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workflows/{wf_id}/validate:
    post:
      tags:
      - workflows
      summary: Validate Workflow
      operationId: validate_workflow_api_workflows__wf_id__validate_post
      parameters:
      - name: wf_id
        in: path
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Wf Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/GraphDef'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ValidateResult_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - workflows
      summary: Validate Workflow Saved
      description: 校验已保存的工作流图。
      operationId: validate_workflow_saved_api_workflows__wf_id__validate_get
      parameters:
      - name: wf_id
        in: path
        required: true
        schema:
          type: string
          title: Wf Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ValidateResult_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workflows/{wf_id}/runs:
    post:
      tags:
      - workflows
      summary: Run Workflow
      description: 发起一次手动运行，立即返回 run_id，后续通过 SSE 观察进度。
      operationId: run_workflow_api_workflows__wf_id__runs_post
      parameters:
      - name: wf_id
        in: path
        required: true
        schema:
          type: string
          title: Wf Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_RunResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workflows/{wf_id}/nodes/{node_id}/test:
    post:
      tags:
      - workflows
      summary: Test Node
      description: 单节点调试：只执行该节点，不写运行记录。
      operationId: test_node_api_workflows__wf_id__nodes__node_id__test_post
      parameters:
      - name: wf_id
        in: path
        required: true
        schema:
          type: string
          title: Wf Id
      - name: node_id
        in: path
        required: true
        schema:
          type: string
          title: Node Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/NodeTestRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_NodeTestResult_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/runs:
    get:
      tags:
      - runs
      summary: List Runs
      operationId: list_runs_api_runs_get
      parameters:
      - name: workflow_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Workflow Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      - name: started_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started After
      - name: started_before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started Before
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_RunListData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - runs
      summary: Create Run
      operationId: create_run_api_runs_post
      parameters:
      - name: workflow_id
        in: query
        required: true
        schema:
          type: string
          title: Workflow Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_RunResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/runs/{run_id}:
    get:
      tags:
      - runs
      summary: Get Run
      operationId: get_run_api_runs__run_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_RunDetail_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/runs/{run_id}/nodes/{node_id}:
    get:
      tags:
      - runs
      summary: Get Node Run
      operationId: get_node_run_api_runs__run_id__nodes__node_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: node_id
        in: path
        required: true
        schema:
          type: string
          title: Node Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_NodeRunDetail_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/runs/{run_id}/cancel:
    post:
      tags:
      - runs
      summary: Cancel Run
      operationId: cancel_run_api_runs__run_id__cancel_post
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_CancelResult_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/runs/{run_id}/rerun:
    post:
      tags:
      - runs
      summary: Rerun
      description: 基于历史运行的图快照 + 输入重新发起运行。
      operationId: rerun_api_runs__run_id__rerun_post
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_RunResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/runs/{run_id}/events:
    get:
      tags:
      - runs
      summary: Run Events
      description: 'SSE - 实时推送 run 事件。


        - 连接时先回放内存事件历史（按 Last-Event-ID 补齐），

        - 内存无历史（如后端重启）时回放已落库的 node_run，

        - 之后持续订阅 EventBus 直到 run 结束。'
      operationId: run_events_api_runs__run_id__events_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: last_event_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Event Id
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Last-Event-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/providers:
    get:
      tags:
      - providers
      summary: List Providers
      operationId: list_providers_api_providers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ProviderListData_'
    post:
      tags:
      - providers
      summary: Create Provider
      operationId: create_provider_api_providers_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ProviderResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/providers/test:
    post:
      tags:
      - providers
      summary: Test Provider
      operationId: test_provider_api_providers_test_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ProviderTestResult_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/providers/{pid}:
    get:
      tags:
      - providers
      summary: Get Provider
      operationId: get_provider_api_providers__pid__get
      parameters:
      - name: pid
        in: path
        required: true
        schema:
          type: string
          title: Pid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ProviderResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - providers
      summary: Update Provider
      operationId: update_provider_api_providers__pid__put
      parameters:
      - name: pid
        in: path
        required: true
        schema:
          type: string
          title: Pid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ProviderResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - providers
      summary: Delete Provider
      operationId: delete_provider_api_providers__pid__delete
      parameters:
      - name: pid
        in: path
        required: true
        schema:
          type: string
          title: Pid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_DeleteResult_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/settings:
    get:
      tags:
      - settings
      summary: Get Settings
      operationId: get_settings_api_settings_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_SettingsResponse_'
    put:
      tags:
      - settings
      summary: Update Settings
      operationId: update_settings_api_settings_put
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Data
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_SettingsResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/settings/system/clear-runs:
    post:
      tags:
      - settings
      summary: Clear Runs
      operationId: clear_runs_api_settings_system_clear_runs_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ClearResult_'
  /api/settings/system/export:
    get:
      tags:
      - settings
      summary: Export Backup
      description: 导出备份 JSON（设置 + 全部工作流，不含服务商密钥）。
      operationId: export_backup_api_settings_system_export_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/settings/system/info:
    get:
      tags:
      - settings
      summary: System Info
      operationId: system_info_api_settings_system_info_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_SystemInfo_'
  /:
    get:
      tags:
      - root
      summary: Root
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health:
    get:
      tags:
      - health
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    ApiResponse_CancelResult_:
      properties:
        code:
          type: integer
          title: Code
          default: 200
        message:
          type: string
          title: Message
          default: ok
        data:
          $ref: '#/components/schemas/CancelResult'
      type: object
      required:
      - data
      title: ApiResponse[CancelResult]
    ApiResponse_ClearResult_:
      properties:
        code:
          type: integer
          title: Code
          default: 200
        message:
          type: string
          title: Message
          default: ok
