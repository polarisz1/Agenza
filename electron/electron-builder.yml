appId: com.agentflow.app
productName: AgentFlow
copyright: Copyright © 2026 AgentFlow

directories:
  buildResources: build
  output: dist_electron

files:
  - main.js
  - preload.js
  - package.json
  - node_modules/**/*
  # 托盘图标与安装包图标共用 electron/build/icon.ico（A1）；没有该文件时
  # electron-builder 会退回默认图标、壳会跳过托盘，不影响启动。
  - build/icon.ico

asar: true

asarUnpack:
  - "**/*.node"

extraResources:
  - from: ../apps/web/dist
    to: frontend-dist
    filter:
      - "**/*"
  - from: ../apps/api/dist_backend
    to: backend
    filter:
      - "**/*.exe"
      - "**/*.dll"
      - "**/*.pyd"

win:
  icon: icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AgentFlow
  uninstallDisplayName: AgentFlow
  include: build/installer.nsh

# 自动更新定案不做（D-4 / backlog A3），因此这里**不配置 publish**：
# 之前写着 `owner: agentflow, repo: releases`（与实际仓库 polarisz1/AgentFlow 不符），
# 一旦有人执行 `electron-builder --publish` 必定 404。发布由
# .github/workflows/release.yml 用 softprops/action-gh-release 完成。
