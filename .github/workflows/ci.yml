name: AgentFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contract drift check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.20'
          enable-cache: true
      - name: uv sync
        working-directory: apps/api
        run: uv sync --all-extras --frozen
      - name: contracts:check
        run: pnpm contracts:check

  api:
    name: Backend lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.20'
          enable-cache: true
      - name: uv sync
        working-directory: apps/api
        run: uv sync --all-extras --frozen
      - name: Ruff lint
        working-directory: apps/api
        run: uv run ruff check src tests
      - name: Ruff format check
        working-directory: apps/api
        run: uv run ruff format --check src tests
      - name: Pytest
        working-directory: apps/api
        run: uv run pytest -q

  web:
    name: Frontend lint + format + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm --filter @agentflow/web lint
      - name: format check
        run: pnpm --filter @agentflow/web format:check
      - name: unit tests
        run: pnpm --filter @agentflow/web test
      - name: build
        run: pnpm --filter @agentflow/web build
