name: Desktop build

# 发布流水线：打 tag 或手动触发 → 构建安装包 + 冒烟 → 建 Release。
# 构建与冒烟在可复用工作流里（desktop-build-smoke.yml），
# 与 PR 级冒烟共用同一份脚本，避免"发布时能跑、PR 时跑不了"的漂移（评审 B5）。

on:
  push:
    tags:
      - 'v*'
  # 手动触发：可以在不打 tag 的情况下把"构建 + 安装包冒烟"整条链路跑一遍
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    uses: ./.github/workflows/desktop-build-smoke.yml

  release:
    needs: [desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Agenza-Setup
          path: ./dist

      - uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          generate_release_notes: true
